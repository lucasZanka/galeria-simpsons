<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personajes de Los Simpsons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Personajes de Los Simpsons</h1>
    <input id="search" type="search" placeholder="Filtrar por nombre en esta página...">
  </header>

  <main>
    <p id="status" role="status"></p>
    <section id="gallery" class="gallery"></section>
  </main>

  <nav class="pager">
    <button id="prev">&laquo; Anterior</button>
    <span id="page-info"></span>
    <button id="next">Siguiente &raquo;</button>
  </nav>

  <dialog id="modal">
    <button id="close" aria-label="Cerrar">&times;</button>
    <div id="modal-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
